<style>
/* VOICE: real, quiet, unsettling — nothing announces itself as a game
   IDEA: the forensic technician's laptop, left unlocked the night the sample vanished
   PICTURE: the desktop itself — wallpaper, menu bar, dock, windows that open and drag
   COLOUR and TYPE: system greys on a deep-teal wallpaper, red only on alerts; IBM Plex Arabic like a system font
   LAYOUT: lock screen → desktop with icons, dock, live notifications; full-screen windows on phones */
:root{color-scheme:light;--ui:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;--win:#f6f6f7;--side:#ececee;--line:#d9d9de;--ink:#1d1d1f;--dim:#6e6e73;--blue:#0a6cff;--red:#e5383b}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font:15px/1.5 var(--ui);color:var(--ink);background:#0b2a30;user-select:none}
.mono{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate}
button,input{font:inherit}
.wall{position:fixed;inset:0;background:#050d12;overflow:hidden}
.wall svg{position:absolute;inset:0;width:100%;height:100%}
.brand{position:fixed;inset:0;pointer-events:none;z-index:0}
.brand img{position:absolute;height:auto;opacity:.92}
.brand.desk .club{bottom:104px;left:24px;width:clamp(120px,13vw,190px)}
.brand.desk .ksu{bottom:100px;right:24px;width:clamp(90px,10vw,150px)}
.brand.lockb{position:absolute;z-index:1}
.brand.lockb .club{top:18px;left:18px;width:clamp(90px,11vw,160px)}
.brand.lockb .ksu{top:18px;right:18px;width:clamp(70px,8.5vw,125px)}
@media(max-width:700px){.brand.desk .ksu{bottom:96px;right:14px;width:84px}.brand.desk .club{top:auto;bottom:100px;left:14px;width:104px}.brand.lockb .club{width:84px;top:12px;left:12px}.brand.lockb .ksu{width:64px;top:12px;right:12px}.lk{padding-top:calc(8vh + 40px)}}
/* ---------- lock ---------- */
#lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;color:#fff;transition:opacity .5s,transform .5s}
#lock .wall{filter:blur(18px) brightness(.8);transform:scale(1.1)}
#lock.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.lk{position:relative;display:flex;flex-direction:column;align-items:center;height:100%;width:100%;padding:8vh 16px 3vh}
.lk .date{font-size:20px;font-weight:500;opacity:.9}
.lk .time{font-size:clamp(72px,14vw,112px);font-weight:600;line-height:1;letter-spacing:-2px}
.notif{width:min(360px,92vw);background:rgba(255,255,255,.22);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:16px;padding:10px 14px;margin:6vh 0 auto;display:flex;gap:10px;font-size:14px}
.notif b{display:block}
.av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#9fb9c4,#5d7f8d);display:grid;place-items:center;font-size:36px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.who{font-size:18px;font-weight:600;margin:10px 0 2px}.role{font-size:13px;opacity:.75;margin-bottom:14px}
.swipe{margin-top:auto;background:none;border:0;color:#fff;font:inherit;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:56px;padding:8px 24px;opacity:.9}
.swipe svg{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-7px)}}
.swipe span{animation:shimmer 2.4s ease-in-out infinite}
@keyframes shimmer{50%{opacity:.45}}
.swipe:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:12px}
.homebar{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);margin-top:10px}
#lock{touch-action:none}
.lk{transition:transform .3s ease-out}
.lk.drag{transition:none}
.legal{font-size:11px;opacity:.5;margin-top:3vh;text-align:center}
/* ---------- menu bar ---------- */
.menubar{position:fixed;top:0;inset-inline:0;height:28px;z-index:60;display:flex;align-items:center;gap:18px;padding:0 14px;background:rgba(20,30,34,.35);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;font-size:13px}
.menubar .app{font-weight:600}
.menubar{white-space:nowrap}
@media(max-width:520px){.menubar .mi{display:none}}.menubar .sp{margin-inline-start:auto;display:flex;gap:14px;align-items:center}
.bat{display:inline-flex;align-items:center;gap:4px}.bat i{width:22px;height:11px;border:1.2px solid #fff;border-radius:3px;position:relative;display:inline-block}.bat i::after{content:"";position:absolute;inset:1.5px;inset-inline-end:auto;width:var(--b,14%);background:#ff5a4f;border-radius:1px}
/* ---------- desktop icons ---------- */
.dicons{position:fixed;top:40px;inset-inline-start:14px;display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:8px 6px;z-index:1}
.dicon{width:86px;text-align:center;color:#fff;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);cursor:default;background:none;border:0;padding:4px;border-radius:6px}
.dicon:focus-visible,.dicon.sel{background:rgba(255,255,255,.18)}
.dicon svg{width:58px;height:58px;display:block;margin:0 auto 4px}
/* ---------- dock ---------- */
.dock{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:70;display:flex;gap:6px;padding:6px;background:rgba(255,255,255,.2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.25);border-radius:20px;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.dock button{position:relative;border:0;background:none;padding:0;cursor:pointer;flex:none;transition:transform .15s}
.dock button:hover{transform:translateY(-6px) scale(1.08)}
.dock svg{width:50px;height:50px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.dock button.run::after{content:"";position:absolute;bottom:-4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff}
.badge[hidden]{display:none}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
/* ---------- windows ---------- */
.win{position:fixed;z-index:10;background:var(--win);border-radius:12px;box-shadow:0 22px 70px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.tb{height:38px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(#ededf0,#e3e3e7);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:#3a3a3c;cursor:grab;touch-action:none}
.lights{position:absolute;inset-inline-end:12px;display:flex;gap:8px;direction:ltr}
.lights span{width:12px;height:12px;border-radius:50%;background:#d0d0d4;border:.5px solid rgba(0,0,0,.12)}
.lights .x{background:#ff5f57;cursor:pointer}
.mclose{display:none}
@media(max-width:700px){.tb{height:48px;font-size:14px}.lights{display:none}.mclose{display:block;position:absolute;inset-inline-end:6px;top:4px;height:40px;padding:0 14px;border:0;border-radius:20px;background:#e1e1e6;color:var(--blue);font:inherit;font-size:15px;font-weight:600;cursor:pointer}}.lights .m{background:#febc2e}.lights .f{background:#28c840}
.wb{flex:1;overflow:auto;user-select:text}
.split{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%}
.list{background:var(--side);border-inline-start:1px solid var(--line);overflow:auto}
.li{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.li.on{background:var(--blue);color:#fff}.li.on small{color:#e6efff}
.li small{display:block;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t{float:inline-end;font-size:12px;color:var(--dim)}.li.on .t{color:#e6efff}
.unread::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-inline-end:6px}
.pane{padding:18px 20px;overflow:auto}
.back{display:none}
/* chat */
.chat{display:flex;flex-direction:column;gap:6px;padding:16px;background:#fff;min-height:100%}
.bb{max-width:78%;padding:8px 12px;border-radius:18px;line-height:1.45;font-size:15px}
.bb.in{background:#e9e9eb;align-self:flex-start;border-end-start-radius:6px}
.bb.out{background:var(--blue);color:#fff;align-self:flex-end;border-end-end-radius:6px}
.bb.typing{color:#8e8e93;letter-spacing:3px;font-weight:700;animation:blink 1s infinite}
.ts{align-self:center;font-size:12px;color:var(--dim);margin:8px 0 2px}
.seen{align-self:flex-end;font-size:11px;color:var(--dim)}
/* mail */
.mh{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.mh h3{margin:0 0 6px;font-size:20px}.mh div{font-size:13px;color:var(--dim)}
.vip{font-style:normal;color:#ffb800;margin-inline-end:4px}.rl{font-size:12px;color:var(--dim);white-space:nowrap}.li.on .rl,.li.on .vip{color:#fff}
.flg{display:inline-block;width:8px;height:10px;background:#ff9500;margin-inline-end:5px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.att{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0 0 6px;font:inherit;font-size:13px;background:#fff;color:var(--ink);cursor:pointer;min-height:44px}
.att:hover,.att:focus-visible{background:#eef4ff;border-color:#9cc0ff;outline:0}
.att::after{content:"فتح";color:var(--blue);font-size:12px;margin-inline-start:6px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:#ffe3e3;color:#b3261e;font-weight:600}
/* files */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:16px}
.file{border:0;background:none;padding:8px;border-radius:8px;text-align:center;font-size:12.5px;cursor:pointer;word-break:break-word}
.file:hover,.file:focus-visible{background:#dfe8ff;outline:0}
.file svg{width:56px;height:64px;display:block;margin:0 auto 6px}
.path{padding:8px 16px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);background:#fafafa}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #d4d4d8;padding:6px 10px;text-align:start;white-space:nowrap}
th{background:#eef3ee;font-weight:600}
td.bad{background:#fff1f1;color:#b3261e}
/* dialog */
.dlg{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.12)}
.dlg>div{width:min(300px,90vw);background:#f4f4f6;border-radius:14px;padding:22px 18px 16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg h4{margin:10px 0 6px;font-size:15px}.dlg p{margin:0 0 14px;font-size:13px;color:#3a3a3c}
.dlg button{width:100%;min-height:36px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:500;cursor:pointer}
/* report */
.doc{background:#fff;max-width:560px;margin:18px auto;padding:30px 34px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:14px}
.doc h2{font-size:17px;margin:0;text-align:center}.doc .sub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:18px}
.red{background:#111;color:#111;border-radius:2px;padding:0 4px}
.corrupt{height:120px;margin-top:14px;background:repeating-linear-gradient(0deg,#ddd 0 3px,#fff 3px 7px),linear-gradient(90deg,#fff,#eee);opacity:.8;display:grid;place-items:center;color:#b3261e;font-weight:600}
/* video */
.player{background:#000;height:100%;display:flex;flex-direction:column;color:#fff}
.scr{flex:1;display:grid;place-items:center;position:relative;font-family:"IBM Plex Mono",monospace;background:repeating-linear-gradient(0deg,#0a0a0a 0 2px,#111 2px 4px)}
.scr .ov{position:absolute;top:10px;left:12px;font-size:13px;direction:ltr}
.ctrl{padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:12px;direction:ltr}
.track{flex:1;height:5px;background:#444;border-radius:3px;position:relative}
.track i{position:absolute;height:100%;background:#e5383b;left:62%;width:10%}
.track b{position:absolute;height:100%;background:#fff;left:0;width:61%;border-radius:3px}
/* notes / browser / cal */
.note{background:#fffbe6;padding:22px;min-height:100%;font-size:15.5px;line-height:1.9}
.note h3{margin:0 0 4px}.note .d{font-size:12px;color:var(--dim);margin-bottom:12px}
.url{margin:10px 14px;padding:7px 12px;border-radius:8px;background:#e8e8ec;font-size:13px;color:var(--dim)}
.hist div{display:flex;gap:14px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:14px}
.hist time{color:var(--dim);flex:none;width:44px}
.ev{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ev .bar{width:4px;border-radius:2px;flex:none}
.ev s{color:var(--dim)}
/* toasts */
#toasts{position:fixed;top:36px;inset-inline-end:12px;z-index:80;display:flex;flex-direction:column;gap:8px;width:min(340px,94vw);max-height:calc(100vh - 120px);overflow-y:auto;scrollbar-width:none;padding-bottom:4px}
#toasts::-webkit-scrollbar{display:none}
.clearall{align-self:flex-end;border:0;border-radius:14px;background:rgba(246,246,248,.85);backdrop-filter:blur(20px);font-size:12.5px;padding:6px 12px;cursor:pointer;min-height:30px}
.netpill{position:fixed;top:36px;left:50%;transform:translateX(-50%);z-index:85;background:rgba(20,30,34,.8);backdrop-filter:blur(20px);color:#fff;border-radius:20px;padding:8px 16px;font-size:13.5px;display:flex;gap:8px;align-items:center;animation:tin .35s ease-out;white-space:nowrap}
.quote{border-inline-start:3px solid var(--line);padding-inline-start:12px;margin-top:16px;color:var(--dim);font-size:14px}
.toast{touch-action:none;user-select:none;background:rgba(246,246,248,.92);backdrop-filter:blur(24px);border-radius:14px;padding:10px 12px;display:flex;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:13.5px;cursor:pointer;animation:tin .35s ease-out}
.toast.out{opacity:0;transform:translateX(-20px);transition:.3s}
.warn{position:fixed;inset:0;z-index:96;display:flex;justify-content:center;align-items:flex-start;padding:16vh 16px 0;background:radial-gradient(ellipse at center,rgba(120,0,10,.25),rgba(40,0,4,.65));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:wfade .25s ease-out}
.warn.bye{opacity:0;transition:opacity .25s}
@keyframes wfade{from{opacity:0}}
.wcard{width:min(400px,92vw);background:linear-gradient(180deg,rgba(38,8,12,.96),rgba(18,4,6,.97));border:1.5px solid #ff3b30;border-radius:24px;padding:20px 22px 18px;color:#fff;cursor:pointer;box-shadow:0 0 0 6px rgba(255,59,48,.12),0 0 60px rgba(255,59,48,.45),0 24px 60px rgba(0,0,0,.6);animation:wdrop .5s cubic-bezier(.2,1.4,.4,1),wshake .45s .5s 2}
@keyframes wdrop{from{transform:translateY(-60px) scale(.9);opacity:0}}
@keyframes wshake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.wicon{width:44px;height:44px;border-radius:50%;background:#ff3b30;display:grid;place-items:center;flex:none;animation:wpulse 1.1s ease-in-out infinite}
@keyframes wpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.7)}50%{box-shadow:0 0 0 12px rgba(255,59,48,0)}}
.wfrom{display:flex;flex-direction:column;font-weight:600;font-size:15px}.wfrom small{font-weight:400;font-size:12.5px;color:#ff9b94}
.wtext{position:relative;font-size:clamp(26px,7vw,34px);font-weight:700;line-height:1.25;color:#fff;text-shadow:0 0 18px rgba(255,59,48,.8);margin:4px 0 18px}
.wtext::before,.wtext::after{content:attr(data-t);position:absolute;inset:0;opacity:.7}
.wtext::before{color:#ff3b30;transform:translate(2px,0);clip-path:inset(0 0 55% 0);animation:glitch 2.2s steps(1) infinite}
.wtext::after{color:#5fe3ff;transform:translate(-2px,0);clip-path:inset(55% 0 0 0);animation:glitch 2.2s .3s steps(1) infinite reverse}
@keyframes glitch{0%,86%,100%{transform:none;opacity:0}88%{transform:translate(4px,-1px);opacity:.8}92%{transform:translate(-3px,1px);opacity:.8}}
.wopen{width:100%;min-height:48px;border:0;border-radius:14px;background:#ff3b30;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.wopen:focus-visible{outline:3px solid #fff;outline-offset:2px}
.toast.alert{box-shadow:0 0 0 2px #ff3b30,0 10px 34px rgba(255,59,48,.45);animation:tin .35s ease-out,alarm 1s ease-in-out 3}
.toast.alert b{color:#d70015}
@keyframes alarm{50%{transform:translateX(-5px)}}
@keyframes tin{from{transform:translateX(-30px);opacity:0}}
.toast svg{width:34px;height:34px;flex:none}.toast b{display:block;font-size:13px;white-space:nowrap}.toast small{color:var(--dim);font-size:11.5px;float:inline-end}
/* low battery + shutdown */
body.dim::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:95;pointer-events:none;transition:background 2s}
#off{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:none;place-items:center;text-align:center;padding:24px}
#off.on{display:grid;animation:offin .6s ease-in}
@keyframes offin{0%{opacity:0;transform:scaleY(.01)}60%{opacity:1;transform:scaleY(.01)}100%{transform:none}}
#off .batE{width:96px;height:46px;border:4px solid #ff3b30;border-radius:10px;position:relative;margin:0 auto;animation:blink 1.2s steps(2) infinite}
#off .batE::after{content:"";position:absolute;inset-inline-end:-12px;top:12px;width:6px;height:14px;background:#ff3b30;border-radius:0 3px 3px 0}
#off .batE::before{content:"";position:absolute;inset:5px;inset-inline-end:auto;width:8px;background:#ff3b30;border-radius:3px}
@keyframes blink{50%{opacity:.3}}
#off .txt{opacity:0;transition:opacity 1.2s;margin-top:34px;font-size:18px;line-height:1.9}
#off.msg .txt{opacity:1}
#off .txt b{font-size:22px}
#reboot{margin-top:22px;min-height:44px;padding:8px 22px;border-radius:22px;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;cursor:pointer}
#reboot:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:700px){
 .win{inset:28px 0 78px 0!important;width:auto!important;height:auto!important;border-radius:0}
 .tb{cursor:default}
 .split{grid-template-columns:1fr}.split.open .list{display:none}.split:not(.open) .pane,.split:not(.open) .chatwrap{display:none}
 .back{display:inline-block;border:0;background:none;color:var(--blue);padding:10px 14px;font-size:15px;cursor:pointer}
 .dock svg{width:44px;height:44px}.dicons{inset-inline:10px;top:38px;grid-template-rows:none;grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 4px}.dicon{width:auto;font-size:11.5px;line-height:1.3}.dicon svg{width:52px;height:52px}
 .doc{padding:20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="brand desk" aria-hidden="true"><img class="club" src="club_logo.png" alt=""></div>

<!-- ===== LOCK ===== -->
<div id="lock">
  <div class="wall"></div>
  <div class="brand lockb" aria-hidden="true"><img class="club" src="club_logo.png" alt=""></div>
  <div class="lk">
    <div class="date" id="lkDate"></div>
    <div class="time" id="lkTime">--:--</div>
    <div class="notif" id="lkNotif"></div>
    <div class="av">ر</div>

  w.className = "win"; w.style.cssText = `width:${W}px;height:${H}px;left:${Math.max(10,(innerWidth-W)/2 - 60 + cascade)}px;top:${50+cascade}px;z-index:${++z}`;

  document.body.appendChild(w); wins[id] = w; a.r(w.querySelector(".wb"));
  w.addEventListener("pointerdown", () => { w.style.zIndex = ++z; $("#mbApp").textContent = a.t; });
  const closeW = e => { e.stopPropagation(); w.remove(); delete wins[id]; renderDock(); };
  w.querySelector(".x").onclick = closeW; w.querySelector(".mclose").onclick = closeW;
  const tb = w.querySelector(".tb");
  tb.addEventListener("pointerdown", e => {
    if (innerWidth <= 700 || e.target.closest(".lights")) return;
    const sx = e.clientX - w.offsetLeft, sy = e.clientY - w.offsetTop; tb.setPointerCapture(e.pointerId);
    const mv = ev => { w.style.left = (ev.clientX - sx) + "px"; w.style.top = Math.max(28, ev.clientY - sy) + "px"; };
    const up = () => { tb.removeEventListener("pointermove", mv); tb.removeEventListener("pointerup", up); };
    tb.addEventListener("pointermove", mv); tb.addEventListener("pointerup", up);
  });
  $("#mbApp").textContent = a.t; renderDock();
};

let actx = null, master = null;
const ensureAudio = () => {
  try {
    if (navigator.audioSession) navigator.audioSession.type = "playback";
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 1;
      const comp = actx.createDynamicsCompressor(); master.connect(comp); comp.connect(actx.destination);
    }
    if (actx.state !== "running") actx.resume();
    const buf = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
    src.buffer = buf; src.connect(actx.destination); src.start(0);
  } catch (e) {}
};
["pointerdown","pointerup","touchend","click","keydown"].forEach(ev => document.addEventListener(ev, () => { if (!actx || actx.state !== "running") ensureAudio(); }, true));
const bell = (f, t, dur, vol = .45) => {
  const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(), g2 = actx.createGain();
  o.type = "sine"; o.frequency.value = f; o2.type = "sine"; o2.frequency.value = f * 2.76;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(vol * .25, t + .005); g2.gain.exponentialRampToValueAtTime(.0001, t + dur * .4);
  o.connect(g).connect(master); o2.connect(g2).connect(master);
  o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05);
};
const sound = kind => {
  if (!actx) return;

    const t = actx.currentTime + .02;
    if (kind === "msg") { bell(1567.98, t, .35); bell(2093, t + .11, .55); }
    else if (kind === "mail") { bell(1174.7, t, .5, .38); bell(1568, t + .07, .7, .32); }
    else if (kind === "cal") { bell(1318.5, t, .4); bell(1318.5, t + .22, .6); }
    else { bell(880, t, .16, .4); bell(880, t + .24, .16, .4); }

};
const toast = (icon, title, text, app, keep, when, life = 7000) => {
  sound(icon);
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `${ICON[icon]}<div><small>${when || "الآن"}</small><b><bdi${/[\u0600-\u06FF]/.test(title)?"":" dir=\"ltr\""}>${title}</bdi></b>${text}</div>`;
  /* swipe up (or sideways) to dismiss, tap to open */
  let sx = null, sy = 0, dx = 0, dy = 0;
  const dismiss = () => { t.style.transition = "transform .2s, opacity .2s"; t.style.transform = `translate(${dx}px,${Math.min(dy,0) - 80}px)`; t.style.opacity = "0"; setTimeout(() => { t.remove(); clearBtn(); }, 200); };
  t.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; dx = dy = 0; t.style.transition = "none"; try { t.setPointerCapture(e.pointerId); } catch (_) {} });
  t.addEventListener("pointermove", e => { if (sx === null) return; dx = e.clientX - sx; dy = e.clientY - sy; t.style.transform = `translate(${Math.abs(dx) > Math.abs(dy) ? dx : 0}px,${Math.min(dy, 0)}px)`; t.style.opacity = String(1 - Math.min(1, (Math.abs(dx) + Math.max(0, -dy)) / 160)); });
  t.addEventListener("pointerup", () => {
    if (sx === null) return; sx = null;
    if (dy < -35 || Math.abs(dx) > 70) dismiss();
    else if (Math.abs(dx) < 6 && Math.abs(dy) < 6) { t.remove(); clearBtn(); app && (typeof app === "function" ? app() : openWin(app)); }
    else { t.style.transition = "transform .2s, opacity .2s"; t.style.transform = ""; t.style.opacity = ""; }
  });
  t.addEventListener("pointercancel", () => { sx = null; t.style.transform = ""; t.style.opacity = ""; });
  const box = $("#toasts"), cb = box.querySelector(".clearall");
  cb ? cb.after(t) : box.prepend(t);
  if (!keep) setTimeout(() => { t.classList.add("out"); setTimeout(() => { t.remove(); clearBtn(); }, 300); }, life);

};
